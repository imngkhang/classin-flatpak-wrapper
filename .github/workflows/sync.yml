name: Sync from Flathub

on:
  schedule:
    - cron: '0 0 * * *' # Auto-sync daily at 00:00 UTC
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream and Preserve README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/flathub/cn.eeo.ClassIn.git
          git fetch upstream master

          if [ $(git rev-list HEAD..upstream/master --count) -gt 0 ]; then
            echo "New commits found in upstream. Merging changes..."

            git merge upstream/master --no-commit --no-ff -X theirs

            git checkout HEAD -- README.md

            git commit -m "sync: merge upstream changes from Flathub (preserve README.md)"
            git push origin main
          else
            echo "Repository is already up to date."
          fi